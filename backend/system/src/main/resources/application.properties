spring.application.name=BuildingAutomationSystem


spring.datasource.url=jdbc:mysql://localhost:3306/buildingautomationsystem
spring.datasource.username=aritra
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# update to match java classes
spring.jpa.hibernate.ddl-auto=update

# Show the SQL queries in the consol
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.session.jdbc.initialize-schema=always

#mqtt broker settings
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=spring-boot-client
mqtt.default.topic=test-topic

# Change port to avoid conflict with the Zombie process
server.port=8080
server.address=0.0.0.0


youtube.api.key=

